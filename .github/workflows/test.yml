name: Test

on:
  push:
    branches: [main, develop, openh264-runtime]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_extended:
        description: Run tagged extended smoke and stress suites
        required: false
        default: false
        type: boolean
      run_hardware:
        description: Run tagged hardware capture suites
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '0 5 * * 1'

env:
  GO_VERSION: '1.25.x'
  GO_VERSION_FULL: '1.25.0'  # Full version for direct downloads (Rosetta job)
  CORE_TEST_PACKAGES: ./internal/ffi ./pkg/... ./test/e2e ./test/interop ./test/benchmark

jobs:
  # Native deterministic core tests
  test:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin_arm64
            extension: dylib
          - os: ubuntu-latest
            platform: linux_amd64
            extension: so
          - os: windows-latest
            platform: windows_amd64
            extension: dll

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Download published shim
        shell: bash
        run: |
          python scripts/download_shim_release.py \
            --platform ${{ matrix.platform }} \
            --output-dir lib/${{ matrix.platform }}
          ls -la lib/${{ matrix.platform }}/

      - name: Run deterministic core tests (purego - default)
        shell: bash
        run: |
          echo "=== Testing deterministic core suites with purego ==="
          go test -v $CORE_TEST_PACKAGES
        env:
          LIBWEBRTC_SHIM_PATH: ${{ github.workspace }}/lib/${{ matrix.platform }}/libwebrtc_shim.${{ matrix.extension }}
          LIBWEBRTC_PREFER_SOFTWARE_CODECS: "1"

      - name: Run deterministic core tests (CGO variant)
        if: runner.os != 'Windows'  # CGO tests need extra setup on Windows
        shell: bash
        run: |
          echo "=== Testing deterministic core suites with CGO ==="
          go test -tags ffigo_cgo -v $CORE_TEST_PACKAGES
        env:
          LIBWEBRTC_SHIM_PATH: ${{ github.workspace }}/lib/${{ matrix.platform }}/libwebrtc_shim.${{ matrix.extension }}
          LIBWEBRTC_PREFER_SOFTWARE_CODECS: "1"

      - name: Enforce package coverage floors
        if: matrix.platform == 'linux_amd64'
        shell: bash
        run: |
          bash ./scripts/check_coverage_floors.sh
        env:
          LIBWEBRTC_SHIM_PATH: ${{ github.workspace }}/lib/${{ matrix.platform }}/libwebrtc_shim.${{ matrix.extension }}
          LIBWEBRTC_PREFER_SOFTWARE_CODECS: "1"

      - name: Run benchmarks (comparison)
        if: runner.os != 'Windows'
        run: |
          echo "=== Benchmark: purego ==="
          go test -bench=BenchmarkShimVersion -benchmem -run=^$ ./internal/ffi/ || true
          echo ""
          echo "=== Benchmark: CGO ==="
          go test -tags ffigo_cgo -bench=BenchmarkShimVersion -benchmem -run=^$ ./internal/ffi/ || true
        env:
          LIBWEBRTC_SHIM_PATH: ${{ github.workspace }}/lib/${{ matrix.platform }}/libwebrtc_shim.${{ matrix.extension }}
          LIBWEBRTC_PREFER_SOFTWARE_CODECS: "1"

  # darwin_amd64 via Rosetta emulation on ARM64 runner
  test-darwin-amd64-rosetta:
    name: darwin_amd64 (Rosetta)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go (x86_64 via Rosetta)
        run: |
          curl -fsSL "https://go.dev/dl/go${{ env.GO_VERSION_FULL }}.darwin-amd64.tar.gz" -o go.tar.gz
          sudo rm -rf /usr/local/go-amd64
          sudo mkdir -p /usr/local/go-amd64
          sudo tar -C /usr/local/go-amd64 -xzf go.tar.gz --strip-components=1
          rm go.tar.gz

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Download published shim
        run: |
          python scripts/download_shim_release.py \
            --platform darwin_amd64 \
            --output-dir lib/darwin_amd64
          ls -la lib/darwin_amd64/
          file lib/darwin_amd64/libwebrtc_shim.dylib

      - name: Run deterministic core tests via Rosetta
        run: |
          echo "=== Testing darwin_amd64 deterministic core suites via Rosetta ==="
          arch -x86_64 /usr/local/go-amd64/bin/go test -v $CORE_TEST_PACKAGES
        env:
          LIBWEBRTC_SHIM_PATH: ${{ github.workspace }}/lib/darwin_amd64/libwebrtc_shim.dylib
          LIBWEBRTC_PREFER_SOFTWARE_CODECS: "1"

      - name: Run deterministic core tests (CGO variant via Rosetta)
        run: |
          echo "=== Testing darwin_amd64 deterministic core suites with CGO via Rosetta ==="
          arch -x86_64 /usr/local/go-amd64/bin/go test -tags ffigo_cgo -v $CORE_TEST_PACKAGES
        env:
          LIBWEBRTC_SHIM_PATH: ${{ github.workspace }}/lib/darwin_amd64/libwebrtc_shim.dylib
          LIBWEBRTC_PREFER_SOFTWARE_CODECS: "1"

  extended:
    name: Extended Smoke And Stress
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_extended)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Download published shim
        shell: bash
        run: |
          python scripts/download_shim_release.py \
            --platform linux_amd64 \
            --output-dir lib/linux_amd64
          ls -la lib/linux_amd64/

      - name: Run tagged extended suites
        shell: bash
        run: |
          go test -tags extended -v ./internal/ffi ./test/e2e ./test/interop
        env:
          LIBWEBRTC_SHIM_PATH: ${{ github.workspace }}/lib/linux_amd64/libwebrtc_shim.so
          LIBWEBRTC_PREFER_SOFTWARE_CODECS: "1"

      - name: Run real auto-download smoke tests
        shell: bash
        run: |
          TEST_PACKAGES="./internal/ffi" GO_TEST_ARGS="-tags=extended -run TestOpenH264AutoDownload|TestCreatePeerConnection|TestCreateVideoDecoderH264|TestCreateVideoEncoderH264|TestGetSupportedVideoCodecsFFI" ./scripts/test_clean_env.sh
          TEST_PACKAGES="./pkg/encoder" GO_TEST_ARGS="-run TestH264EncoderEncode" ./scripts/test_clean_env.sh
          TEST_PACKAGES="./pkg/decoder" GO_TEST_ARGS="-run TestH264EncodeDecode" ./scripts/test_clean_env.sh
          TEST_PACKAGES="./pkg/pc" GO_TEST_ARGS="-run TestGetSupportedVideoCodecs" ./scripts/test_clean_env.sh
        env:
          LIBWEBRTC_PREFER_SOFTWARE_CODECS: "1"

  hardware:
    name: Hardware Capture
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_hardware)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Download published shim
        shell: bash
        run: |
          python scripts/download_shim_release.py \
            --platform darwin_arm64 \
            --output-dir lib/darwin_arm64
          ls -la lib/darwin_arm64/

      - name: Run tagged hardware suites
        shell: bash
        run: |
          go test -tags hardware -v ./test/e2e
        env:
          LIBWEBRTC_SHIM_PATH: ${{ github.workspace }}/lib/darwin_arm64/libwebrtc_shim.dylib
          LIBWEBRTC_PREFER_SOFTWARE_CODECS: "1"

  validate-linux-386-docker:
    name: linux_386 (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate linux_386 in Docker
        run: ./scripts/validate_linux_docker.sh --target linux_386 --download-only
