name: Validate Shim Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      build_assets:
        description: Build shim release assets instead of validating a published release
        required: false
        default: false
        type: boolean
      shim_version:
        description: Shim release version used for artifact naming (for example 0.4.6)
        required: false
        default: ""
        type: string

env:
  GO_VERSION: '1.26.1'
  GO_VERSION_FULL: '1.26.1'

jobs:
  validate:
    if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.build_assets) && (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'shim-v')) }}
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin_arm64
            extension: dylib
          - os: ubuntu-latest
            platform: linux_amd64
            extension: so
          - os: windows-latest
            platform: windows_amd64
            extension: dll

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Verify docs contract
        shell: bash
        run: bash ./scripts/check_docs_contract.sh

      - name: Download published shim
        shell: bash
        run: |
          python scripts/download_shim_release.py \
            --platform ${{ matrix.platform }} \
            --output-dir lib/${{ matrix.platform }}
          ls -la lib/${{ matrix.platform }}/

      - name: Run tests (purego - default)
        shell: bash
        run: |
          go test -v ./pkg/frame/... ./pkg/codec/...
          go test -v ./internal/ffi/...
          go test -v ./pkg/encoder/... ./pkg/decoder/...
        env:
          LIBWEBRTC_SHIM_PATH: ${{ github.workspace }}/lib/${{ matrix.platform }}/libwebrtc_shim.${{ matrix.extension }}
          LIBWEBRTC_PREFER_SOFTWARE_CODECS: "1"

      - name: Run auto-download smoke tests
        if: runner.os != 'Windows'
        shell: bash
        run: |
          TEST_PACKAGES="./internal/ffi" GO_TEST_ARGS="-run TestCreatePeerConnection|TestCreateVideoDecoderH264|TestCreateVideoEncoderH264|TestGetSupportedVideoCodecsFFI" ./scripts/test_clean_env.sh
          TEST_PACKAGES="./pkg/encoder" GO_TEST_ARGS="-run TestH264EncoderEncode" ./scripts/test_clean_env.sh
          TEST_PACKAGES="./pkg/decoder" GO_TEST_ARGS="-run TestH264EncodeDecode" ./scripts/test_clean_env.sh
          TEST_PACKAGES="./pkg/pc" GO_TEST_ARGS="-run TestGetSupportedVideoCodecs" ./scripts/test_clean_env.sh
        env:
          LIBWEBRTC_PREFER_SOFTWARE_CODECS: "1"

  validate-darwin-amd64-rosetta:
    if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.build_assets) && (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'shim-v')) }}
    name: darwin_amd64 (Rosetta)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - name: Setup Go (x86_64 via Rosetta)
        run: |
          curl -fsSL "https://go.dev/dl/go${{ env.GO_VERSION_FULL }}.darwin-amd64.tar.gz" -o go.tar.gz
          sudo rm -rf /usr/local/go-amd64
          sudo mkdir -p /usr/local/go-amd64
          sudo tar -C /usr/local/go-amd64 -xzf go.tar.gz --strip-components=1
          rm go.tar.gz

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Verify docs contract
        shell: bash
        run: bash ./scripts/check_docs_contract.sh

      - name: Download published shim
        shell: bash
        run: |
          python scripts/download_shim_release.py \
            --platform darwin_amd64 \
            --output-dir lib/darwin_amd64
          ls -la lib/darwin_amd64/
          file lib/darwin_amd64/libwebrtc_shim.dylib

      - name: Run tests via Rosetta
        shell: bash
        run: |
          arch -x86_64 /usr/local/go-amd64/bin/go test -v ./pkg/frame/... ./pkg/codec/...
          arch -x86_64 /usr/local/go-amd64/bin/go test -v ./internal/ffi/...
          arch -x86_64 /usr/local/go-amd64/bin/go test -v ./pkg/encoder/... ./pkg/decoder/...
        env:
          LIBWEBRTC_SHIM_PATH: ${{ github.workspace }}/lib/darwin_amd64/libwebrtc_shim.dylib
          LIBWEBRTC_PREFER_SOFTWARE_CODECS: "1"

      - name: Run auto-download smoke tests via Rosetta
        shell: bash
        run: |
          TEST_PACKAGES="./internal/ffi" GO_TEST_ARGS="-run TestCreatePeerConnection|TestCreateVideoDecoderH264|TestCreateVideoEncoderH264|TestGetSupportedVideoCodecsFFI" ./scripts/test_clean_env.sh
          TEST_PACKAGES="./pkg/encoder" GO_TEST_ARGS="-run TestH264EncoderEncode" ./scripts/test_clean_env.sh
          TEST_PACKAGES="./pkg/decoder" GO_TEST_ARGS="-run TestH264EncodeDecode" ./scripts/test_clean_env.sh
          TEST_PACKAGES="./pkg/pc" GO_TEST_ARGS="-run TestGetSupportedVideoCodecs" ./scripts/test_clean_env.sh
        env:
          LIBWEBRTC_PREFER_SOFTWARE_CODECS: "1"
          TEST_CLEAN_ENV_GO_PREFIX: "arch -x86_64"
          TEST_CLEAN_ENV_GO_BIN: "/usr/local/go-amd64/bin/go"
          GOARCH: amd64
          GOOS: darwin

  validate-linux-386-docker:
    if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.build_assets) && (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'shim-v')) }}
    name: linux_386 (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Validate linux_386 release in Docker
        run: ./scripts/validate_linux_docker.sh --target linux_386 --download-only

  validate-linux-amd64-docker:
    if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.build_assets) && (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'shim-v')) }}
    name: linux_amd64 (Docker compatibility)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Validate linux_amd64 release in Docker
        run: ./scripts/validate_linux_docker.sh --target linux_amd64 --download-only

  build-macos-assets:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_assets }}
    name: build ${{ matrix.platform }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [darwin_arm64, darwin_amd64]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install Bazelisk
        shell: bash
        run: |
          GOBIN="$HOME/go/bin" go install github.com/bazelbuild/bazelisk@latest

      - name: Build release asset
        shell: bash
        run: |
          PATH="$HOME/go/bin:$PATH" ./scripts/build.sh --target ${{ matrix.platform }} --release

      - name: Collect release asset
        shell: bash
        run: |
          mkdir -p release-assets
          mv "libwebrtc_shim_${{ matrix.platform }}.tar.gz" release-assets/
          mv "libwebrtc_shim_${{ matrix.platform }}.tar.gz.sha256" release-assets/

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: shim-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error

  build-linux-assets:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_assets }}
    name: build ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux_amd64, linux_386]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Build release asset in Docker
        shell: bash
        run: |
          ./scripts/validate_linux_docker.sh --target ${{ matrix.platform }} --artifact-dir build-output/${{ matrix.platform }}

      - name: Package release asset
        shell: bash
        run: |
          mkdir -p release-assets
          asset="libwebrtc_shim_${{ matrix.platform }}.tar.gz"
          tar -C "build-output/${{ matrix.platform }}" -czf "release-assets/${asset}" .
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "release-assets/${asset}" > "release-assets/${asset}.sha256"
          else
            shasum -a 256 "release-assets/${asset}" > "release-assets/${asset}.sha256"
          fi

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: shim-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error

  build-windows-asset:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_assets }}
    name: build windows_amd64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install Bazelisk
        shell: bash
        run: |
          GOBIN="$HOME/go/bin" go install github.com/bazelbuild/bazelisk@latest

      - name: Build release asset
        shell: bash
        run: |
          PATH="$HOME/go/bin:$PATH" ./scripts/build.sh --target windows_amd64 --release

      - name: Collect release asset
        shell: bash
        run: |
          mkdir -p release-assets
          mv "libwebrtc_shim_windows_amd64.tar.gz" release-assets/
          mv "libwebrtc_shim_windows_amd64.tar.gz.sha256" release-assets/

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: shim-windows_amd64
          path: release-assets/*
          if-no-files-found: error
