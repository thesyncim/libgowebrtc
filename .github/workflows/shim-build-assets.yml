name: Build Shim Assets

on:
  workflow_dispatch:
    inputs:
      version:
        description: Shim release version without the shim-v prefix (for example 0.4.6)
        required: true
        type: string

env:
  GO_VERSION: "1.26.2"
  BAZELISK_VERSION: v1.26.0
  SHIM_RELEASE_TAG: shim-v${{ inputs.version }}

jobs:
  build-macos:
    name: ${{ matrix.platform }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [darwin_arm64, darwin_amd64]
    steps:
      - uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install Bazelisk
        shell: bash
        run: |
          GOBIN="$HOME/go/bin" go install github.com/bazelbuild/bazelisk@${{ env.BAZELISK_VERSION }}
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Build release archive
        shell: bash
        run: |
          ./scripts/build.sh --target "${{ matrix.platform }}" --release
          mkdir -p "release/${SHIM_RELEASE_TAG}"
          mv "libwebrtc_shim_${{ matrix.platform }}.tar.gz" "release/${SHIM_RELEASE_TAG}/"
          mv "libwebrtc_shim_${{ matrix.platform }}.tar.gz.sha256" "release/${SHIM_RELEASE_TAG}/"

      - name: Upload platform artifact
        uses: actions/upload-artifact@v7
        with:
          name: shim-${{ matrix.platform }}
          path: release/${{ env.SHIM_RELEASE_TAG }}/
          if-no-files-found: error

  build-linux:
    name: ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux_amd64, linux_386]
    steps:
      - uses: actions/checkout@v6

      - name: Validate and extract platform artifact
        shell: bash
        run: |
          ./scripts/validate_linux_docker.sh --target "${{ matrix.platform }}" --artifact-dir "$RUNNER_TEMP/${{ matrix.platform }}"

      - name: Package release archive
        shell: bash
        run: |
          release_dir="release/${SHIM_RELEASE_TAG}"
          mkdir -p "$release_dir"
          archive="libwebrtc_shim_${{ matrix.platform }}.tar.gz"
          pushd "$RUNNER_TEMP/${{ matrix.platform }}" >/dev/null
          tar -czf "$GITHUB_WORKSPACE/$release_dir/$archive" $(find . -maxdepth 1 -type f -printf '%P\n' | sort)
          popd >/dev/null
          sha256sum "$release_dir/$archive" > "$release_dir/$archive.sha256"

      - name: Upload platform artifact
        uses: actions/upload-artifact@v7
        with:
          name: shim-${{ matrix.platform }}
          path: release/${{ env.SHIM_RELEASE_TAG }}/
          if-no-files-found: error

  build-windows:
    name: windows_amd64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Ensure 7-Zip is available
        shell: bash
        run: |
          if ! command -v 7z >/dev/null 2>&1; then
            choco install 7zip -y
          fi

      - name: Install Bazelisk
        shell: bash
        run: |
          GOBIN="$HOME/go/bin" go install github.com/bazelbuild/bazelisk@${{ env.BAZELISK_VERSION }}
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Build release archive
        shell: bash
        run: |
          ./scripts/build.sh --target windows_amd64 --release
          mkdir -p "release/${SHIM_RELEASE_TAG}"
          mv "libwebrtc_shim_windows_amd64.tar.gz" "release/${SHIM_RELEASE_TAG}/"
          mv "libwebrtc_shim_windows_amd64.tar.gz.sha256" "release/${SHIM_RELEASE_TAG}/"

      - name: Upload platform artifact
        uses: actions/upload-artifact@v7
        with:
          name: shim-windows_amd64
          path: release/${{ env.SHIM_RELEASE_TAG }}/
          if-no-files-found: error

  assemble:
    name: Assemble Release Bundle
    runs-on: ubuntu-latest
    needs: [build-macos, build-linux, build-windows]
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: shim-*
          path: release/${{ env.SHIM_RELEASE_TAG }}
          merge-multiple: true

      - name: List assembled files
        shell: bash
        run: |
          ls -la "release/${SHIM_RELEASE_TAG}"

      - name: Upload assembled release bundle
        uses: actions/upload-artifact@v7
        with:
          name: shim-release-${{ env.SHIM_RELEASE_TAG }}
          path: release/${{ env.SHIM_RELEASE_TAG }}/
          if-no-files-found: error
